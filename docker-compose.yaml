version: "3.8"

services:

  24points:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 24Points-CoreUI
    restart: no

    command:

      - sh
      - -c
      - |
        mkdir -p /output &&
        cp -av /usr/src/app/dist/community-app/. /output/ &&
        echo "COPY COMPLETE" &&
        ls -la /output

    volumes:
      - app_dist:/output



  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - app_dist:/usr/share/nginx/html:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - 24points
    restart: always

volumes:
  app_dist:
