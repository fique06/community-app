server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FRONTEND
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BACKEND PROXY (THIS FIXES CORS)
    location /fineract-provider/ {
	    add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, fineract-platform-tenantid" always;
       
	proxy_hide_header Access-Control-Allow-Origin;
	proxy_hide_header Access-Control-Allow-Headers;
	proxy_hide_header Access-Control-Allow-Methods;
	       if ($request_method = OPTIONS) {
                return 204;
        }
        proxy_pass https://161.35.167.155:8443/fineract-provider/;

	proxy_ssl_verify off;

	proxy_ssl_server_name on;


        proxy_set_header Host 161.35.167.155;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # IMPORTANT for self-signed backend
      
    }
}
